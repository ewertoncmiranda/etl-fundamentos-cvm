name: Deploy to Docker Hub

on:
  push:
    branches:
      - main
      - develop

jobs:
  # O build so acontece depois que lint, mypy e testes passam. O repo irmao
  # publica 'latest' sem rodar teste nenhum (gerar-insights#ISS-05); aqui nao.
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests main.py

      - name: Type check (mypy)
        run: mypy app

      - name: Tests
        env:
          ENVIRONMENT: local
        run: pytest tests/ -v -m "not externo"

  build-and-push:
    needs: qualidade
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/etl-fundamentos-cvm
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/etl-fundamentos-cvm:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/etl-fundamentos-cvm:buildcache,mode=max

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ secrets.DOCKER_USERNAME }}/etl-fundamentos-cvm
          short-description: "ETL dos dados abertos da CVM para o ecossistema B3"
          readme-filepath: ./README.md
