name: Auto PR Feature to Develop

on:
  push:
    branches:
      - 'feature**'

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests main.py

      - name: Type check (mypy)
        run: mypy app

      # -m "not externo" mantem fora o teste que bate no Fundamentus: site de
      # terceiro fora do ar nao pode quebrar o build.
      - name: Tests
        env:
          ENVIRONMENT: local
        run: pytest tests/ -v -m "not externo"

  create-pr:
    needs: qualidade
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR to develop
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const { data: existentes } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              base: 'develop',
              state: 'open',
            });

            if (existentes.length > 0) {
              core.info(`PR ja existe: ${existentes[0].html_url}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: branch,
              base: 'develop',
              title: `${branch}`,
              body: 'PR aberto automaticamente pelo workflow apos lint, mypy e testes passarem.',
            });
            core.info(`PR criado: ${pr.html_url}`);
